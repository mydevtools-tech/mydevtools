[package]
name = "mydevtools-desktop"
version = "0.1.18"
description = "MyDevTools desktop app"
edition = "2021"

[lib]
name = "mydevtools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
getrandom = "0.4"
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "gzip", "multipart", "stream"] }
base64 = "0.23"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Secure Files: the .mydt format/crypto lives in the shared `mydt` crate (also the CLI).
mydt = { path = "../../../crates/mydt" }
zeroize = "1"
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
h2 = "0.4"
http = "1"
bytes = "1"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
mongodb = "3"
redis = { version = "1", features = ["tokio-comp", "tokio-native-tls-comp"] }
futures-util = "0.3"
dashmap = "6"

# The keyring backend is the one genuinely platform-specific dependency: the
# macOS Keychain vs. the Linux Secret Service (GNOME Keyring / KWallet).
# db/device_key.rs uses only the portable `Entry` API, so the code is identical
# on both — only the backend feature differs.
#
# Linux uses sync-secret-service, NOT linux-native: the latter stores in kernel
# keyutils, which is session-scoped and can be lost on reboot. The SQLCipher key
# must persist or the user loses access to their local database.
# ponytail: keyring 4 restructured stores (keyring-core + per-platform crates); staying on 3
# until there's a reason to migrate the Keychain-backed SQLCipher key path.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
